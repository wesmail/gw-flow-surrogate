# Stage-1 compact model (~5M params) for 10k-scale runs on a single GPU.
# Full-size baseline: configs/stage1_large.yaml (70M params).
seed_everything: 42

trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_mismatch
        mode: min
        save_top_k: 3
        filename: "epoch={epoch:03d}-val_mismatch={val_mismatch:.4f}"
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_mismatch
        patience: 15
        mode: min
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: logs
      name: stage1_small

model:
  d_model: 192
  n_layers: 6
  n_heads: 6
  n_channels: 1
  patch_len: 32
  horizon: 4
  dropout: 0.05
  learning_rate: 3.0e-4
  weight_decay: 0.1
  lambda_phi: 1.0
  lambda_coh: 0.1
  probabilistic: false
  couple_amplitude: false
  scheduled_sampling_max: 0.5

data:
  manifest_path: ./data/generated/10k/manifest.parquet
  batch_size: 32
  num_workers: 4
  patch_len: 32
  context_patches: 1
  compute_stats_if_missing: true
