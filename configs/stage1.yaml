# Convergence test on the 10k NRHybSur dataset (~2.5M params).
# 9000 train / batch 32 -> ~281 steps/epoch; 50 epochs ~ 14k steps.
seed_everything: 42

trainer:
  max_epochs: 50
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_mismatch
        mode: min
        save_top_k: 2
        save_last: true
        filename: "{epoch:03d}-{val_mismatch:.4f}"
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    # NOTE: no EarlyStopping for the convergence test — you want the full curve.
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: logs
      name: flow_25k_small

model:
  d_model: 128
  n_layers: 6
  n_heads: 4
  n_kv_heads: 2
  n_channels: 1
  patch_len: 32
  n_prefix: 4
  dropout: 0.0            # small model + dense data: start without dropout
  grad_ckpt: false
  head_width: 128
  head_depth: 2
  num_horizons: 4
  n_sampling_steps: 20
  loss_on_context: true
  residual_scale: 0.082006    # <-- REPLACE with compute_residual_scale output before running
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 500       # ~1.8 epochs
  max_steps: -1
  min_lr_ratio: 0.1
  rollout_n_waveforms: 4
  rollout_n_samples: 1
  rollout_max_patches: 0  # full 319-patch rollout each val epoch

data:
  manifest_path: ./data/25k/manifest.parquet
  batch_size: 64
  num_workers: 16
  persistent_workers: true
  prefetch_factor: 4
  patch_len: 32
  context_patches: 1
  compute_stats_if_missing: true